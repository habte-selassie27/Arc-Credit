<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="aBody" x1="50" y1="0" x2="50" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CECBF6"/>
      <stop offset="35%" stop-color="#AFA9EC"/>
      <stop offset="70%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <linearGradient id="aDark" x1="50" y1="0" x2="50" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <linearGradient id="aRibbon" x1="10" y1="75" x2="110" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#534AB7"/>
      <stop offset="40%" stop-color="#AFA9EC"/>
      <stop offset="70%" stop-color="#CECBF6"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="aRibbonDark" x1="10" y1="75" x2="110" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3C3489"/>
      <stop offset="50%" stop-color="#534AB7"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <linearGradient id="aShine" x1="45" y1="0" x2="65" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEEDFE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#CECBF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- A shape - left leg (back, darker) -->
  <path d="M 52 5 L 18 90 L 38 90 L 52 50 Z" fill="url(#aDark)"/>

  <!-- A shape - right leg (front, lighter) -->
  <path d="M 52 5 L 86 90 L 66 90 L 52 50 Z" fill="url(#aBody)"/>

  <!-- A shape - crossbar -->
  <path d="M 26 62 L 78 62 L 74 52 L 30 52 Z" fill="url(#aDark)" opacity="0.6"/>

  <!-- Highlight shine on A -->
  <path d="M 52 5 L 56 50 L 52 50 Z" fill="url(#aShine)"/>

  <!-- Ribbon behind (darker) -->
  <path d="M 14 82 C 14 42, 42 10, 72 8 C 92 6, 108 22, 112 42 C 108 38, 92 28, 72 30 C 48 32, 22 54, 22 78 Z" fill="url(#aRibbonDark)" opacity="0.5"/>

  <!-- Ribbon front (main) -->
  <path d="M 18 80 C 18 44, 44 14, 72 12 C 90 10, 104 24, 108 40 C 100 34, 86 26, 72 28 C 50 30, 26 52, 26 76 Z" fill="url(#aRibbon)"/>

  <!-- Ribbon highlight -->
  <path d="M 22 76 C 22 48, 46 20, 72 18 C 88 16, 100 28, 104 38 C 96 32, 84 26, 72 28 C 52 30, 30 50, 30 72 Z" fill="#CECBF6" opacity="0.3"/>
</svg>
