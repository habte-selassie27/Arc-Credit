<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcCredit — Brand Guide</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans)}
    .wrap{display:flex;flex-direction:column;gap:32px;padding:32px 24px}
    .label{font-size:11px;color:var(--text-muted);margin-bottom:12px;letter-spacing:.06em}
    .row{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
    .swatch{display:flex;flex-direction:column;align-items:center;gap:8px}
    .swatch-box{width:48px;height:48px;border-radius:8px}
    .swatch-name{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
    .divider{height:0.5px;background:var(--border);margin:8px 0}
  </style>
</head>
<body>
  <div class="wrap">

    <div>
      <div class="label">Primary — light bg</div>
      <svg width="340" height="72" viewBox="0 0 340 72" role="img">
        <title>ArcCredit logo on light background</title>
        <desc>The ArcCredit logo: an arc-shaped credit score ring mark with wordmark</desc>
        <g transform="translate(0,4)">
          <circle cx="32" cy="32" r="28" fill="#EEEDFE" />
          <path d="M 32 8 A 24 24 0 1 1 10.7 46" fill="none" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>
          <path d="M 10.7 46 A 24 24 0 0 1 32 8" fill="none" stroke="#CECBF6" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="8" r="3.5" fill="#534AB7"/>
          <circle cx="10.7" cy="46" r="3.5" fill="#7F77DD"/>
          <text x="32" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C" font-family="system-ui,sans-serif">AC</text>
        </g>
        <text x="80" y="30" font-size="22" font-weight="600" fill="#0b0b0b" font-family="system-ui,sans-serif" letter-spacing="-0.5">Arc</text>
        <text x="80" y="54" font-size="14" font-weight="400" fill="#5F5E5A" font-family="system-ui,sans-serif" letter-spacing="0.5">Credit</text>
      </svg>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Stacked lockup</div>
      <svg width="180" height="130" viewBox="0 0 180 130" role="img">
        <title>ArcCredit stacked logo</title>
        <desc>ArcCredit stacked logo with mark above wordmark</desc>
        <g transform="translate(58,8)">
          <circle cx="32" cy="32" r="28" fill="#EEEDFE"/>
          <path d="M 32 8 A 24 24 0 1 1 10.7 46" fill="none" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>
          <path d="M 10.7 46 A 24 24 0 0 1 32 8" fill="none" stroke="#CECBF6" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="8" r="3.5" fill="#534AB7"/>
          <circle cx="10.7" cy="46" r="3.5" fill="#7F77DD"/>
          <text x="32" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C" font-family="system-ui,sans-serif">AC</text>
        </g>
        <text x="90" y="88" text-anchor="middle" font-size="20" font-weight="600" fill="#0b0b0b" font-family="system-ui,sans-serif" letter-spacing="-0.3">Arc<tspan fill="#534AB7">Credit</tspan></text>
        <text x="90" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#888780" font-family="system-ui,sans-serif" letter-spacing="1.2">ONCHAIN CREDIT</text>
      </svg>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Dark background version</div>
      <svg width="340" height="80" viewBox="0 0 340 80" role="img" style="background:#1a1833;border-radius:12px">
        <title>ArcCredit logo on dark background</title>
        <desc>ArcCredit logo reversed for dark backgrounds</desc>
        <g transform="translate(16,8)">
          <circle cx="32" cy="32" r="28" fill="#26215C"/>
          <path d="M 32 8 A 24 24 0 1 1 10.7 46" fill="none" stroke="#AFA9EC" stroke-width="5" stroke-linecap="round"/>
          <path d="M 10.7 46 A 24 24 0 0 1 32 8" fill="none" stroke="#3C3489" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="8" r="3.5" fill="#AFA9EC"/>
          <circle cx="10.7" cy="46" r="3.5" fill="#7F77DD"/>
          <text x="32" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#EEEDFE" font-family="system-ui,sans-serif">AC</text>
        </g>
        <text x="96" y="30" font-size="22" font-weight="600" fill="#ffffff" font-family="system-ui,sans-serif" letter-spacing="-0.5">Arc</text>
        <text x="96" y="54" font-size="14" font-weight="400" fill="#AFA9EC" font-family="system-ui,sans-serif" letter-spacing="0.5">Credit</text>
      </svg>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Mark only — icon / favicon sizes</div>
      <div class="row">
        <div class="swatch">
          <svg width="64" height="64" viewBox="0 0 64 64" role="img">
            <title>ArcCredit icon 64px</title>
            <circle cx="32" cy="32" r="30" fill="#EEEDFE"/>
            <path d="M 32 6 A 26 26 0 1 1 7.4 49" fill="none" stroke="#534AB7" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M 7.4 49 A 26 26 0 0 1 32 6" fill="none" stroke="#CECBF6" stroke-width="5.5" stroke-linecap="round"/>
            <circle cx="32" cy="6" r="4" fill="#534AB7"/>
            <circle cx="7.4" cy="49" r="4" fill="#7F77DD"/>
            <text x="32" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#26215C" font-family="system-ui,sans-serif">AC</text>
          </svg>
          <span class="swatch-name">64px</span>
        </div>
        <div class="swatch">
          <svg width="40" height="40" viewBox="0 0 64 64" role="img">
            <title>ArcCredit icon 40px</title>
            <circle cx="32" cy="32" r="30" fill="#EEEDFE"/>
            <path d="M 32 6 A 26 26 0 1 1 7.4 49" fill="none" stroke="#534AB7" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M 7.4 49 A 26 26 0 0 1 32 6" fill="none" stroke="#CECBF6" stroke-width="5.5" stroke-linecap="round"/>
            <circle cx="32" cy="6" r="4" fill="#534AB7"/>
            <circle cx="7.4" cy="49" r="4" fill="#7F77DD"/>
            <text x="32" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#26215C" font-family="system-ui,sans-serif">AC</text>
          </svg>
          <span class="swatch-name">40px</span>
        </div>
        <div class="swatch">
          <svg width="24" height="24" viewBox="0 0 64 64" role="img">
            <title>ArcCredit favicon</title>
            <circle cx="32" cy="32" r="30" fill="#534AB7"/>
            <path d="M 32 6 A 26 26 0 1 1 7.4 49" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <path d="M 7.4 49 A 26 26 0 0 1 32 6" fill="none" stroke="#AFA9EC" stroke-width="6" stroke-linecap="round"/>
            <circle cx="32" cy="6" r="4.5" fill="#ffffff"/>
            <circle cx="7.4" cy="49" r="4.5" fill="#CECBF6"/>
          </svg>
          <span class="swatch-name">favicon</span>
        </div>
        <div class="swatch">
          <svg width="40" height="40" viewBox="0 0 64 64" role="img">
            <title>ArcCredit dark icon</title>
            <circle cx="32" cy="32" r="30" fill="#26215C"/>
            <path d="M 32 6 A 26 26 0 1 1 7.4 49" fill="none" stroke="#AFA9EC" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M 7.4 49 A 26 26 0 0 1 32 6" fill="none" stroke="#3C3489" stroke-width="5.5" stroke-linecap="round"/>
            <circle cx="32" cy="6" r="4" fill="#AFA9EC"/>
            <circle cx="7.4" cy="49" r="4" fill="#7F77DD"/>
            <text x="32" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#EEEDFE" font-family="system-ui,sans-serif">AC</text>
          </svg>
          <span class="swatch-name">dark</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Brand colors</div>
      <div class="row">
        <div class="swatch"><div class="swatch-box" style="background:#534AB7"></div><span class="swatch-name">#534AB7</span></div>
        <div class="swatch"><div class="swatch-box" style="background:#7F77DD"></div><span class="swatch-name">#7F77DD</span></div>
        <div class="swatch"><div class="swatch-box" style="background:#AFA9EC"></div><span class="swatch-name">#AFA9EC</span></div>
        <div class="swatch"><div class="swatch-box" style="background:#CECBF6"></div><span class="swatch-name">#CECBF6</span></div>
        <div class="swatch"><div class="swatch-box" style="background:#EEEDFE;border:0.5px solid #CECBF6"></div><span class="swatch-name">#EEEDFE</span></div>
        <div class="swatch"><div class="swatch-box" style="background:#26215C"></div><span class="swatch-name">#26215C</span></div>
      </div>
    </div>

  </div>
</body>
</html>
