<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="aMain" x1="60" y1="0" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CECBF6"/>
      <stop offset="40%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <linearGradient id="aRibbon" x1="10" y1="80" x2="110" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#534AB7"/>
      <stop offset="50%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="aHighlight" x1="50" y1="0" x2="70" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEEDFE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#CECBF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Main A shape - left leg -->
  <path d="M 48 8 L 20 88" stroke="url(#aMain)" stroke-width="16" stroke-linecap="round"/>

  <!-- Main A shape - right leg -->
  <path d="M 48 8 L 76 88" stroke="url(#aMain)" stroke-width="16" stroke-linecap="round"/>

  <!-- Crossbar -->
  <path d="M 28 60 L 68 60" stroke="#7F77DD" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Arch ribbon wrapping around -->
  <path d="M 16 82 C 16 40, 48 8, 80 8 C 100 8, 112 28, 112 48" fill="none" stroke="url(#aRibbon)" stroke-width="10" stroke-linecap="round"/>

  <!-- Ribbon highlight -->
  <path d="M 20 78 C 20 42, 48 14, 78 14 C 96 14, 106 30, 106 46" fill="none" stroke="#CECBF6" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Left base dot -->
  <circle cx="16" cy="86" r="5" fill="#534AB7"/>

  <!-- Right base dot -->
  <circle cx="80" cy="86" r="5" fill="#7F77DD"/>
</svg>
